name: Invart Proof Gate

on:
  pull_request:
  workflow_dispatch:

jobs:
  proof-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Invart
        run: python -m pip install -e .

      - name: Generate proof and ledger
        run: |
          mkdir -p .invart
          invart session start --target . --agent github-actions --goal "Exercise Invart proof gate" --session-id invart_ci_proof_gate --ledger .invart/ledger.jsonl --no-preflight
          invart runtime shell --session invart_ci_proof_gate --ledger .invart/ledger.jsonl --agent github-actions --target . --policy-mode ci -- python3 -c 'print("invart proof gate")'
          invart session close --ledger .invart/ledger.jsonl
          invart proof export --ledger .invart/ledger.jsonl --out .invart/proof.json

      - name: Verify proof and ledger
        run: |
          test -f .invart/proof.json
          test -f .invart/ledger.jsonl
          invart proof verify --proof .invart/proof.json --ledger .invart/ledger.jsonl
          invart gate verify --proof .invart/proof.json --ledger .invart/ledger.jsonl --mode ci --out .invart/gate-report.json

      - name: Upload Invart artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: invart-proof-gate
          path: |
            .invart/proof.json
            .invart/ledger.jsonl
            .invart/gate-report.json
